title: Site

tabs:

  content:
    columns:
      - width: 1/1
        sections:
            pages:
              headline: Menüpunkte
              type: pages
              status: listed


  meta:
    columns:
        - width: 1/1
          fields:
            logotype:
              type: files
              label: Wortmarke
              max: 1
            # privacy:
            #   label: Datenschutzerklärung
            #   type: pages
            #   max: 1
            social:
              label: Social Media
              type: structure
              fields:
                icon:
                  label: Icon
                  type: files
                  max: 1
                  required: true
                type:
                  type: select
                  search: false
                  default: link
                  empty: false
                  options:
                    mail: E-Mail
                    link: Link
                url:
                  label: URL
                  type: url
                  when:
                    type: link
                mail:
                  label: Mail
                  type: email
                  when:
                    type: mail
            description:
              type: textarea
              size: small
              label: SEO-Beschreibung
              buttons: false
            thumbnail:
              type: files
              max: 1
              label: SEO-Thumbail
