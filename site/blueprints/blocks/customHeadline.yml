name: Headline

fields:
  size:
    label: Schriftgröße
    type: select
    empty: false
    default: lg
    options:
      md: Medium
      lg: Large
  headline:
    label: Headline
    type: structure
    help: Bei langen Wörtern mit `&shy;` definieren, wo das Wort getrennt werden soll
    fields:
      text:
        label: Text
        type: text
        width: 2/3
      align:
        label: Ausrichten
        width: 1/3
